name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum

      - name: Verify backend
        working-directory: backend-go
        env:
          CGO_ENABLED: 1
        run: |
          fixture_dir="$(mktemp -d)"
          trap 'rm -rf "$fixture_dir"' EXIT
          go run ./cmd/generate_regression_fixtures -out "$fixture_dir"
          diff --recursive --unified internal/services/testdata/regression "$fixture_dir"

          go test -count=1 -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out

          total_coverage="$(go tool cover -func=coverage.out | awk '/^total:/ { gsub("%", "", $3); print $3 }')"
          if [ -z "$total_coverage" ]; then
            echo "无法读取后端整体覆盖率"
            exit 1
          fi

          awk -v coverage="$total_coverage" 'BEGIN {
            if (coverage + 0 < 35.0) {
              printf "后端整体覆盖率 %.1f%%，低于要求的 35.0%%\n", coverage
              exit 1
            }
            printf "后端整体覆盖率 %.1f%%，达到要求的 35.0%%\n", coverage
          }'
          go vet ./...

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Verify frontend
        working-directory: frontend
        run: |
          npm run lint:ci
          npm run test:run
          npm run build

  build-and-push:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify final image excludes regression testdata
        if: github.event_name == 'pull_request'
        env:
          BUILT_IMAGE_ID: ${{ steps.build.outputs.imageid }}
        run: |
          set -Eeuo pipefail
          container_id="$(docker create "$BUILT_IMAGE_ID")"
          image_listing="$(mktemp)"
          cleanup() {
            docker rm "$container_id" >/dev/null
            rm -f "$image_listing"
          }
          trap cleanup EXIT

          docker export "$container_id" | tar -tf - >"$image_listing"
          if grep -E '(^|/)app/backend/internal/services/testdata/regression(/|$)' "$image_listing"; then
            echo "::error::Production image contains regression testdata"
            exit 1
          fi

      - name: Verify built image health
        if: github.event_name == 'pull_request'
        env:
          BUILT_IMAGE_ID: ${{ steps.build.outputs.imageid }}
          JWT_SECRET: ci-health-check-only-not-for-production-0123456789abcdef
        run: |
          set -Eeuo pipefail

          project_name="sbm-health-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          compose=(
            docker compose
            --project-name "$project_name"
            -f docker-compose.yml
            -f docker-compose.production.yml
          )

          cleanup() {
            local exit_code=$?
            trap - EXIT
            "${compose[@]}" down --volumes --remove-orphans || true
            exit "$exit_code"
          }
          diagnose_container() {
            local diagnostic_container_id
            "${compose[@]}" ps --all || true
            diagnostic_container_id="$("${compose[@]}" ps --all --quiet smart-bill-manager 2>/dev/null || true)"
            if [ -n "$diagnostic_container_id" ]; then
              docker inspect --format 'state={{json .State}}' "$diagnostic_container_id" || true
            fi
            "${compose[@]}" logs --no-color --timestamps smart-bill-manager || true
          }
          trap cleanup EXIT

          if [ -z "$BUILT_IMAGE_ID" ]; then
            echo "::error::Buildx did not return an image ID for the loaded PR image"
            exit 1
          fi

          mapfile -t compose_images < <("${compose[@]}" config --images)
          if [ "${#compose_images[@]}" -ne 1 ] || [ -z "${compose_images[0]:-}" ]; then
            echo "::error::Expected exactly one image from the production Compose configuration"
            printf 'Resolved images: %s\n' "${compose_images[*]:-<none>}"
            exit 1
          fi
          compose_image="${compose_images[0]}"

          docker image inspect "$BUILT_IMAGE_ID" >/dev/null
          docker tag "$BUILT_IMAGE_ID" "$compose_image"
          loaded_image_id="$(docker image inspect --format '{{.Id}}' "$compose_image")"
          if [ "$loaded_image_id" != "$BUILT_IMAGE_ID" ]; then
            echo "::error::Compose image does not reference this workflow's Buildx result"
            echo "Buildx image: $BUILT_IMAGE_ID"
            echo "Compose image: $loaded_image_id"
            exit 1
          fi

          if ! "${compose[@]}" up \
            --no-build \
            --pull never \
            --wait \
            --wait-timeout 180 \
            smart-bill-manager; then
            echo "::error::Built container did not become healthy within 180 seconds"
            diagnose_container
            exit 1
          fi

          container_id="$("${compose[@]}" ps --quiet smart-bill-manager)"
          if [ -z "$container_id" ]; then
            echo "::error::Compose reported success without a running container"
            diagnose_container
            exit 1
          fi
          health_status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' "$container_id")"
          if [ "$health_status" != "healthy" ]; then
            echo "::error::Compose returned before the container was healthy: $health_status"
            diagnose_container
            exit 1
          fi
          echo "Verified healthy container from Buildx image $BUILT_IMAGE_ID"
          "${compose[@]}" ps
