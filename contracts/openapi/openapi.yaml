          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /reimbursements/{reimbursement_id}:
    get:
      operationId: getReimbursement
      tags: [reimbursements]
      parameters:
        - $ref: "#/components/parameters/ReimbursementId"
      responses:
        "200":
          description: 报销快照、确定性提示与完整状态决定历史
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReimbursementDetail"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /reimbursements/{reimbursement_id}/status-decisions:
    post:
      operationId: changeReimbursementStatus
      tags: [reimbursements]
      parameters:
        - $ref: "#/components/parameters/ReimbursementId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReimbursementStatusRequest"
      responses:
        "200":
          description: 状态已按期望版本转换，或返回相同幂等请求的稳定结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReimbursementMutationResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /insights:
    get:
      operationId: queryInsights
      tags: [insights]
      parameters:
        - name: fact_type
          in: query
          schema: { type: string, enum: [all, payment, invoice], default: all }
        - name: date_from
          in: query
          description: 必须与 date_to 同时提供，包含起始日。
          schema: { type: string, format: date }
        - name: date_to
          in: query
          description: 必须与 date_from 同时提供，包含结束日。
          schema: { type: string, format: date }
        - name: currency
          in: query
          schema: { $ref: "#/components/schemas/Currency" }
        - name: allocation_status
          in: query
          schema:
            {
              type: string,
              enum: [all, unallocated, partial, allocated],
              default: all,
            }
        - name: trip_scope
          in: query
          schema:
            { type: string, enum: [all, assigned, unassigned], default: all }
        - name: trip_id
          in: query
          description: 仅在 trip_scope=assigned 时可用。
          schema: { type: string, format: uuid }
        - name: cursor
          in: query
          schema: { type: string, minLength: 1, maxLength: 2048 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: 同一 PostgreSQL REPEATABLE READ 只读快照内的确定性分组汇总与稳定 Fact 明细页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsightPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /facts/{fact_type}/{fact_id}/bad-debt:
    post:
      operationId: setFactBadDebt
      tags: [facts]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - { name: fact_type, in: path, required: true, schema: { $ref: "#/components/schemas/AllocationFactType" } }
        - { name: fact_id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BadDebtRequest" }
      responses:
        "200":
          description: 坏账状态已变更或原请求重放
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BadDebtResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /allocations/{fact_type}/{fact_id}:
    get:
      operationId: getAllocationWorkspace
      tags: [allocations]
      parameters:
        - name: fact_type
          in: path
          required: true
          schema: { $ref: "#/components/schemas/AllocationFactType" }
        - name: fact_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: 已确认 Fact 的当前活动分配计划与合格目标
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllocationWorkspace"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /allocations/{fact_type}/{fact_id}/targets:
    get:
      operationId: searchAllocationTargets
      tags: [allocations]
      parameters:
        - { name: fact_type, in: path, required: true, schema: { $ref: "#/components/schemas/AllocationFactType" } }
        - { name: fact_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
        - { name: view, in: query, schema: { type: string, enum: [recommended, all_dates], default: recommended } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 512 } }
      responses:
        "200":
          description: 同币种可分配目标的有界页；全部日期包含超过 30 天的目标
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AllocationTargetPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /allocations/{fact_type}/{fact_id}/adjustments:
    post:
      operationId: adjustAllocation
      tags: [allocations]
      parameters:
        - name: fact_type
          in: path
          required: true
          schema: { $ref: "#/components/schemas/AllocationFactType" }
        - name: fact_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AllocationAdjustmentRequest"
      responses:
        "200":
          description: 首次调整或严格幂等重放结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllocationAdjustmentResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /provider-configs:
    get:
      operationId: listProviderConfigs
      tags: [providers]
      responses:
        "200":
          description: 不含可恢复密钥材料的配置列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProviderConfig"
    post:
      operationId: createProviderConfig
      tags: [providers]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [base_url, api_key, model, output_mode]
              properties:
                base_url:
                  type: string
                  format: uri
                api_key:
                  type: string
                  minLength: 1
                  maxLength: 4096
                model:
                  type: string
                  minLength: 1
                  maxLength: 200
                output_mode:
                  type: string
                  enum: [json_schema, json_object]
      responses:
        "201":
          description: 待检测配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderConfig"
  /provider-configs/{provider_config_id}/detect:
    post:
      operationId: detectProviderCapabilities
      tags: [providers]
      parameters:
        - $ref: "#/components/parameters/ProviderConfigId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: 能力检测结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderConfig"
  /provider-configs/{provider_config_id}/activate:
    post:
      operationId: activateProviderConfig
      tags: [providers]
      parameters:
        - $ref: "#/components/parameters/ProviderConfigId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: 已激活且检测通过的配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderConfig"
        "409":
          $ref: "#/components/responses/Conflict"
  /provider-configs/{provider_config_id}:
    delete:
      operationId: deleteProviderConfig
      tags: [providers]
      parameters:
        - $ref: "#/components/parameters/ProviderConfigId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: 配置已停用，密文已立即清除并写入审计事件
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sbm_session
  parameters:
    FactCursor:
      name: cursor
      in: query
      schema: { type: string, maxLength: 2048 }
    FactLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    FactDateFrom:
      name: date_from
      in: query
      schema: { type: string, format: date }
    FactDateTo:
      name: date_to
      in: query
      schema: { type: string, format: date }
    FactSearch:
      name: q
      in: query
      description: 折叠空白后的字面子串，搜索现有名称及单号。
      schema: { type: string, maxLength: 200 }
    FactAllocationStatus:
      name: allocation_status
      in: query
      schema: { type: string, enum: [all, unallocated, partial, allocated], default: all }
    CorrectionFactType:
      name: fact_type
      in: path
      required: true
      schema: { type: string, enum: [payment, invoice, trip] }
    CorrectionFactId:
      name: fact_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 32
        maxLength: 256
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    DocumentId:
      name: document_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ClaimSetId:
      name: claim_set_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PaymentId:
      name: payment_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvoiceId:
      name: invoice_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TripId:
      name: trip_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReimbursementId:
      name: reimbursement_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProviderConfigId:
      name: provider_config_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EmailSourceId:
      name: source_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EmailMessageId:
      name: message_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EmailAttachmentId:
      name: attachment_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: 输入不合法
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: 未认证
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: 权限或 CSRF 校验失败
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: 资源不存在或对当前租户不可见
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: 幂等、版本、重复或状态冲突
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: 请求载荷超过对应接口限制
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: 服务尚未就绪
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    ExportScope:
      type: object
      additionalProperties: false
      required: [kind, id]
      properties:
        kind: { type: string, enum: [trip, reimbursement] }
        id: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$' }
    ExportPrepareRequest:
      type: object
      additionalProperties: false
      required: [kind, id, expected_manifest_hash, acknowledged_warnings]
      properties:
        kind: { type: string, enum: [trip, reimbursement] }
        id: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$' }
        expected_manifest_hash: { type: string, pattern: '^[a-f0-9]{64}$' }
        acknowledged_warnings: { type: boolean }
    ExportReference:
      type: object
      additionalProperties: false
      required: [kind, relation_id, fact_type, fact_id, fact_version, review_decision_id, display_name, business_date, amount_minor, currency, document_id]
      properties:
        kind: { type: string, enum: [original, auxiliary] }
        relation_id: { type: string }
        fact_type: { type: string, enum: [payment, invoice, trip_evidence] }
        fact_id: { type: string }
        fact_version: { type: [integer, "null"], minimum: 1 }
        review_decision_id: { type: [string, "null"] }
        display_name: { type: string }
        business_date: { type: string, format: date }
        amount_minor: { type: [integer, "null"], minimum: 0, maximum: 9007199254740991 }
        currency: { type: string }
        document_id: { type: string }
    ExportFile:
      type: object
      additionalProperties: false
      required: [document_id, original_name, path, mime, size_bytes, sha256]
      properties:
        document_id: { type: string }
        original_name: { type: string }
        path: { type: string }
        mime: { type: string, enum: [image/png, image/jpeg, image/webp, application/pdf] }
        size_bytes: { type: integer, minimum: 1, maximum: 20971520 }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
    ExportManifest:
      type: object
      additionalProperties: false
      required: [schema_version, scope, name, version, trip, snapshot_hash, materials_captured, warnings, references, files, source_bytes, manifest_hash]
      properties:
        schema_version: { type: string, const: material-delivery/1 }
        scope: { $ref: "#/components/schemas/ExportScope" }
        name: { type: string }
        version: { type: integer, minimum: 1 }
        trip: { $ref: "#/components/schemas/ReimbursementTripSnapshot" }
        snapshot_hash: { type: string }
        materials_captured: { type: boolean }
        warnings: { type: array, items: { type: string }, maxItems: 3 }
        references: { type: array, items: { $ref: "#/components/schemas/ExportReference" }, maxItems: 5000 }
        files: { type: array, items: { $ref: "#/components/schemas/ExportFile" }, maxItems: 1000 }
        source_bytes: { type: integer, minimum: 1, maximum: 536870912 }
        manifest_hash: { type: string, pattern: '^[a-f0-9]{64}$' }
    ExportPrepared:
      type: object
      additionalProperties: false
      required: [id, file_name, size_bytes, manifest_hash, expires_at]
      properties:
        id: { type: string }
        file_name: { type: string }
        size_bytes: { type: integer, minimum: 1, maximum: 545259520 }
        manifest_hash: { type: string, pattern: '^[a-f0-9]{64}$' }
        expires_at: { type: string, format: date-time }
    WorkspaceLoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 1024, writeOnly: true }
    WorkspaceChoices:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name, role]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              role: { $ref: "#/components/schemas/Role" }
    Member:
      type: object
      additionalProperties: false
      required: [user_id, email, display_name, role, status, version, created_at]
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        status: { type: string, enum: [active, suspended] }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
    MemberPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/Member" } }
        next_cursor: { type: string }
    MemberChange:
      type: object
      additionalProperties: false
      required: [role, status, expected_version, reason]
      properties:
        role: { $ref: "#/components/schemas/Role" }
        status: { type: string, enum: [active, suspended] }
        expected_version: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 1, maxLength: 500 }
    Invitation:
      type: object
      additionalProperties: false
      required: [id, email, role, status, version, expires_at, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/Role" }
        status: { type: string, enum: [pending, consumed, revoked, expired] }
        version: { type: integer, minimum: 1, maximum: 2 }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    InvitationPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/Invitation" } }
        next_cursor: { type: string }
    InvitationRequest:
      type: object
      additionalProperties: false
      required: [email, role, reason, idempotency_key]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        role: { $ref: "#/components/schemas/Role" }
        reason: { type: string, minLength: 1, maxLength: 500 }
        idempotency_key: { type: string, minLength: 8, maxLength: 128 }
    InvitationCreated:
      type: object
      additionalProperties: false
      required: [invitation, code, replayed]
      properties:
        invitation: { $ref: "#/components/schemas/Invitation" }
        code: { type: string, maxLength: 43, description: 只返回一次，回放为空；不得保存到 URL、storage 或日志 }
        replayed: { type: boolean }
    InvitationRevocation:
      type: object
      additionalProperties: false
      required: [expected_version, reason]
      properties:
        expected_version: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 1, maxLength: 500 }
    InvitationCode:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, minLength: 43, maxLength: 43, writeOnly: true }
    InvitationView:
      type: object
      additionalProperties: false
      required: [tenant_name, email, role, existing_account, expires_at]
      properties:
        tenant_name: { type: string }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/Role" }
        existing_account: { type: boolean }
        expires_at: { type: string, format: date-time }
    InvitationAcceptance:
      type: object
      additionalProperties: false
      required: [code, display_name, password]
      properties:
        code: { type: string, minLength: 43, maxLength: 43, writeOnly: true }
        display_name: { type: string, maxLength: 100 }
        password: { type: string, minLength: 1, maxLength: 1024, writeOnly: true }
    PasswordChange:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password: { type: string, minLength: 1, maxLength: 1024, writeOnly: true }
        new_password: { type: string, minLength: 12, maxLength: 1024, writeOnly: true }
    CorrectionRequest:
      type: object
      additionalProperties: false
      required: [expected_version, current_review_decision_id, fields, reason, withdraw_link_ids]
      properties:
        expected_version: { type: integer, minimum: 1 }
        current_review_decision_id: { type: string, format: uuid }
        fields:
          $ref: "#/components/schemas/RevisionRequest/properties/fields"
          description: 固定当前类型的完整快照；纠错允许在真实 AI 根上追加人工证据，不伪造根来源。
        reason: { type: string, minLength: 1, maxLength: 500 }
        withdraw_link_ids:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
    CorrectionConfirmRequest:
      type: object
      additionalProperties: false
      required: [expected_version, current_review_decision_id, fields, reason, withdraw_link_ids, preview_hash, acknowledged_duplicate_keys]
      properties:
        expected_version: { type: integer, minimum: 1 }
        current_review_decision_id: { type: string, format: uuid }
        fields: { $ref: "#/components/schemas/CorrectionRequest/properties/fields" }
        reason: { type: string, minLength: 1, maxLength: 500 }
        withdraw_link_ids: { $ref: "#/components/schemas/CorrectionRequest/properties/withdraw_link_ids" }
        preview_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        acknowledged_duplicate_keys:
          type: array
          maxItems: 50
          uniqueItems: true
          items: { type: string, pattern: "^[0-9a-f]{64}$" }
    CorrectionLink:
      type: object
      additionalProperties: false
      required: [id, target_id, allocated_minor, currency, target_currency, target_business_date, target_amount_minor, target_allocated_minor, target_version, target_available]
      properties:
        id: { type: string, format: uuid }
        target_id: { type: string, format: uuid }
        allocated_minor: { type: integer, minimum: 1, maximum: 9007199254740991 }
        currency: { type: string, enum: [CNY, USD, EUR, JPY] }
        target_currency: { type: string, enum: [CNY, USD, EUR, JPY] }
        target_business_date: { type: string, format: date }
        target_amount_minor: { type: integer, minimum: 0, maximum: 9007199254740991 }
        target_allocated_minor: { type: integer, minimum: 0, maximum: 9007199254740991 }
        target_version: { type: integer, minimum: 1 }
        target_available: { type: boolean }
    CorrectionState:
      type: object
      additionalProperties: false
      required: [fact_type, fact_id, version, current_review_decision_id, claim_set_id, document_id, links, attribution]
      properties:
        fact_type: { type: string, enum: [payment, invoice, trip] }
        fact_id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        current_review_decision_id: { type: string, format: uuid }
        claim_set_id: { type: string, format: uuid }
        document_id: { type: string, format: uuid }
        links:
          type: array
          items: { $ref: "#/components/schemas/CorrectionLink" }
        attribution:
          type: object
          additionalProperties: false
          required: [mode, assignment_id, current_trip_id, desired_trip_id, matching_trip_count, matching_trip_version]
          properties:
            mode: { type: string, enum: [auto, manual, blocked, preserve_material_links] }
            assignment_id: { type: string }
            current_trip_id: { type: string }
            desired_trip_id: { type: string }
            matching_trip_count: { type: integer, minimum: 0 }
            matching_trip_version: { type: integer, minimum: 0 }
    CorrectionWorkspace:
      type: object
      additionalProperties: false
      required: [state, review]
      properties:
        state: { $ref: "#/components/schemas/CorrectionState" }
        review: { $ref: "#/components/schemas/Review" }
    CorrectionPreview:
      type: object
      additionalProperties: false
      required: [state, issues, duplicates, withdraw_link_ids, preview_hash, can_confirm]
      properties:
        state: { $ref: "#/components/schemas/CorrectionState" }
        withdraw_link_ids: { $ref: "#/components/schemas/CorrectionRequest/properties/withdraw_link_ids" }
        preview_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        can_confirm: { type: boolean }
        issues:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [code, message]
            properties:
              link_id: { type: string, format: uuid }
              code: { type: string }
              message: { type: string }
        duplicates:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [key, kind, existing_document_id, existing_payment_id, existing_invoice_id, target_revision_id, reason_codes]
            properties:
              key: { type: string }
              kind: { type: string, enum: [near_file, cross_page, field_combination] }
              existing_document_id: { type: string }
              existing_payment_id: { type: string }
              existing_invoice_id: { type: string }
              target_revision_id: { type: string }
              reason_codes:
                type: array
                items: { type: string }
    CorrectionResult:
      type: object
      additionalProperties: false
      required: [fact_type, fact_id, review_decision_id, claim_set_id, version, replayed]
      properties:
        fact_type: { type: string, enum: [payment, invoice, trip] }
        fact_id: { type: string, format: uuid }
        review_decision_id: { type: string, format: uuid }
        claim_set_id: { type: string, format: uuid }
        version: { type: integer, minimum: 2 }
        replayed: { type: boolean }
    CorrectionHistoryPage:
      type: object
      additionalProperties: false
      required: [items, next_before_revision]
      properties:
        next_before_revision: { type: [integer, "null"], minimum: 1 }
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [review_decision_id, previous_review_decision_id, claim_set_id, revision, actor_user_id, reason, created_at]
            properties:
              review_decision_id: { type: string, format: uuid }
              previous_review_decision_id: { type: string }
              claim_set_id: { type: string, format: uuid }
              revision: { type: integer, minimum: 1 }
              actor_user_id: { type: string, format: uuid }
              reason: { type: string }
              created_at: { type: string, format: date-time }
    Health:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        status:
          const: ok
        version:
          type: string
    Readiness:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        status:
          const: ready
        version:
          type: string
    Error:
      $ref: ../schemas/error.schema.json
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 1024
        tenant_id:
          type: string
          format: uuid
    Session:
      type: object
      additionalProperties: false
      required: [user, tenant, role, capabilities, csrf_token, expires_at]
      properties:
        user:
          $ref: "#/components/schemas/User"
        tenant:
          $ref: "#/components/schemas/Tenant"
        role:
          $ref: "#/components/schemas/Role"
        capabilities:
          type: array
          items:
            type: string
          uniqueItems: true
        csrf_token:
          type: string
        expires_at:
          type: string
          format: date-time
    User:
      type: object
