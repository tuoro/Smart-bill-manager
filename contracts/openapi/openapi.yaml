      properties:
        trip_id: { type: string, format: uuid }
        assignment_ids:
          type: array
          minItems: 1
          maxItems: 200
          uniqueItems: true
          items: { type: string, format: uuid }
    ReimbursementSubmissionRequest:
      type: object
      additionalProperties: false
      required:
        [
          trip_id,
          assignment_ids,
          expected_snapshot_hash,
          acknowledged_finding_keys,
          reason,
        ]
      properties:
        trip_id: { type: string, format: uuid }
        assignment_ids:
          type: array
          minItems: 1
          maxItems: 200
          uniqueItems: true
          items: { type: string, format: uuid }
        expected_snapshot_hash: { type: string, pattern: "^[a-f0-9]{64}$" }
        acknowledged_finding_keys:
          type: array
          maxItems: 1000
          uniqueItems: true
          items: { type: string, pattern: "^[a-f0-9]{64}$" }
        reason: { type: string, minLength: 1, maxLength: 500 }
    ReimbursementSummary:
      type: object
      additionalProperties: false
      required:
        [
          id,
          trip,
          trip_deleted,
          status,
          version,
          item_count,
          finding_count,
          created_at,
          updated_at,
        ]
      properties:
        id: { type: string, format: uuid }
        trip: { $ref: "#/components/schemas/ReimbursementTripSnapshot" }
        trip_deleted: { type: boolean }
        status: { $ref: "#/components/schemas/ReimbursementStatus" }
        version: { type: integer, minimum: 1 }
        item_count: { type: integer, minimum: 1, maximum: 200 }
        finding_count: { type: integer, minimum: 0, maximum: 1000 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ReimbursementPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ReimbursementSummary" }
        next_cursor: { type: string, minLength: 1, maxLength: 1024 }
    ReimbursementItem:
      type: object
      additionalProperties: false
      required:
        [
          id,
          assignment_id,
          fact_type,
          fact_id,
          source_deleted,
          display_name,
          business_date,
          amount_minor,
          currency,
          sort_order,
        ]
      properties:
        fact_review_decision_id: { type: [string, "null"], format: uuid }
        id: { type: string, format: uuid }
        assignment_id: { type: string, format: uuid }
        fact_type: { $ref: "#/components/schemas/AllocationFactType" }
        fact_id: { type: string, format: uuid }
        source_deleted: { type: boolean }
        display_name: { type: string, minLength: 1 }
        business_date: { type: string, format: date }
        amount_minor:
          {
            type: integer,
            format: int64,
            minimum: 0,
            maximum: 9007199254740991,
          }
        currency: { $ref: "#/components/schemas/Currency" }
        sort_order: { type: integer, minimum: 0, maximum: 199 }
    ReimbursementFinding:
      type: object
      additionalProperties: false
      required: [id, item_id, finding_key, code]
      properties:
        id: { type: string, format: uuid }
        item_id: { type: string, format: uuid }
        finding_key: { type: string, pattern: "^[a-f0-9]{64}$" }
        code:
          {
            type: string,
            enum: [missing_invoice, amount_conflict, duplicate_reimbursement],
          }
        expected_minor:
          {
            type: integer,
            format: int64,
            minimum: 0,
            maximum: 9007199254740991,
          }
        actual_minor:
          {
            type: integer,
            format: int64,
            minimum: 0,
            maximum: 9007199254740991,
          }
        currency: { $ref: "#/components/schemas/Currency" }
        related_reimbursement_id: { type: string, format: uuid }
        related_status: { $ref: "#/components/schemas/ReimbursementStatus" }
    ReimbursementDecision:
      type: object
      additionalProperties: false
      required:
        [
          id,
          action,
          previous_status,
          desired_status,
          expected_version,
          result_version,
          reason,
          created_at,
        ]
      properties:
        id: { type: string, format: uuid }
        action:
          { type: string, enum: [submit, mark_reimbursed, reject, reopen] }
        previous_status:
          oneOf:
            - { $ref: "#/components/schemas/ReimbursementStatus" }
            - { type: "null" }
        desired_status: { $ref: "#/components/schemas/ReimbursementStatus" }
        expected_version: { type: integer, minimum: 0 }
        result_version: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 1, maxLength: 500 }
        created_at: { type: string, format: date-time }
    ReimbursementDetail:
      type: object
      additionalProperties: false
      required:
        [
          id,
          trip,
          trip_deleted,
          status,
          version,
          item_count,
          finding_count,
          created_at,
          updated_at,
          rule_version,
          snapshot_hash,
          totals_by_currency,
          items,
          findings,
          decisions,
          materials_captured,
          material_count,
        ]
      properties:
        id: { type: string, format: uuid }
        trip: { $ref: "#/components/schemas/ReimbursementTripSnapshot" }
        trip_deleted: { type: boolean }
        status: { $ref: "#/components/schemas/ReimbursementStatus" }
        version: { type: integer, minimum: 1 }
        item_count: { type: integer, minimum: 1, maximum: 200 }
        finding_count: { type: integer, minimum: 0, maximum: 1000 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        rule_version: { type: string, enum: [reimbursement-policy/1, reimbursement-policy/2] }
        materials_captured: { type: boolean }
        material_count: { type: [integer, "null"], minimum: 0, maximum: 20000 }
        snapshot_hash: { type: string, pattern: "^[a-f0-9]{64}$" }
        totals_by_currency:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ReimbursementCurrencyTotal" }
        items:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: "#/components/schemas/ReimbursementItem" }
        findings:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/ReimbursementFinding" }
        decisions:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ReimbursementDecision" }
    ReimbursementStatusRequest:
      type: object
      additionalProperties: false
      required: [expected_status, desired_status, expected_version, reason]
      properties:
        expected_status: { $ref: "#/components/schemas/ReimbursementStatus" }
        desired_status: { $ref: "#/components/schemas/ReimbursementStatus" }
