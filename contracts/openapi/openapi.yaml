        id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
    Tenant:
      type: object
      additionalProperties: false
      required: [id, name, default_currency, timezone]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        default_currency: { $ref: "#/components/schemas/Currency" }
        timezone: { type: string }
    Role:
      type: string
      enum: [owner, finance, reviewer, viewer]
    Currency:
      type: string
      enum: [CNY, USD, EUR, JPY]
    UploadResult:
      type: object
      additionalProperties: false
      required: [document_id, job_id, status, sha256]
      properties:
        document_id: { type: string, format: uuid }
        job_id: { type: string, format: uuid }
        status: { const: queued }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
    EmailSourceRegistration:
      type: object
      additionalProperties: false
      required:
        [
          display_name,
          mailbox_address,
          imap_host,
          imap_port,
          transport_security,
        ]
      properties:
        display_name: { type: string, minLength: 1, maxLength: 100 }
        mailbox_address:
          { type: string, format: email, minLength: 3, maxLength: 254 }
        imap_host: { type: string, minLength: 1, maxLength: 253 }
        imap_port: { type: integer, minimum: 1, maximum: 65535 }
        transport_security:
          type: string
          enum: [implicit_tls, starttls]
    EmailSource:
      type: object
      additionalProperties: false
      required:
        - id
        - display_name
        - mailbox_address
        - imap_host
        - imap_port
        - transport_security
        - status
        - created_by_user_id
        - created_at
        - version
        - message_count
        - attachment_count
        - blocked_count
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string, minLength: 1, maxLength: 100 }
        mailbox_address: { type: string, format: email, maxLength: 254 }
        imap_host: { type: string, maxLength: 253 }
        imap_port: { type: integer, minimum: 1, maximum: 65535 }
        transport_security:
          type: string
          enum: [implicit_tls, starttls]
        status:
          type: string
          enum: [pending_connection, active]
        created_by_user_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        last_archived_at: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
        message_count: { type: integer, minimum: 0 }
        attachment_count: { type: integer, minimum: 0 }
        blocked_count: { type: integer, minimum: 0 }
    EmailMessagePage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EmailMessage"
        next_cursor: { type: string, minLength: 1, maxLength: 1024 }
    EmailMessage:
      type: object
      additionalProperties: false
      required:
        - id
        - email_source_id
        - subject
        - sender_address
        - received_at
        - status
        - created_at
        - attachments
      properties:
        id: { type: string, format: uuid }
        email_source_id: { type: string, format: uuid }
        subject: { type: string, maxLength: 500 }
        sender_address: { type: string, maxLength: 254 }
        sent_at: { type: string, format: date-time }
        received_at: { type: string, format: date-time }
        status: { type: string, enum: [archived, blocked] }
        safe_error_code: { type: string, maxLength: 100 }
        safe_error_text: { type: string, maxLength: 200 }
        created_at: { type: string, format: date-time }
        attachments:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/EmailAttachment"
    EmailAttachment:
      type: object
      additionalProperties: false
      required:
        - id
        - part_index
        - original_name
        - declared_mime
        - disposition
        - size_bytes
        - processing_status
      properties:
        id: { type: string, format: uuid }
        part_index: { type: integer, minimum: 1, maximum: 50 }
        original_name: { type: string, minLength: 1, maxLength: 200 }
        declared_mime: { type: string, minLength: 1, maxLength: 200 }
        disposition: { type: string, enum: [attachment, inline] }
        size_bytes:
          { type: integer, format: int64, minimum: 0, maximum: 33554432 }
        processing_status:
          type: string
          enum: [queued, existing_document, archived_only]
        safe_reason_code: { type: string, minLength: 1, maxLength: 100 }
        document_id: { type: string, format: uuid }
        job_id: { type: string, format: uuid }
    JobSummary:
      type: object
      additionalProperties: false
      required:
        [
          id,
          document_id,
          original_name,
          ingestion_kind,
          detected_mime,
          status,
          attempt_count,
          created_at,
          version,
        ]
      properties:
        id: { type: string, format: uuid }
        document_id: { type: string, format: uuid }
        original_name: { type: string }
        ingestion_kind: { type: string, enum: [upload, email_attachment] }
        detected_mime: { type: string }
        status:
          type: string
          enum:
            [
              queued,
              processing,
              needs_review,
              blocked,
              failed,
              cancel_requested,
              cancelled,
              completed,
              rejected,
            ]
        attempt_count: { type: integer, minimum: 0 }
        error_code: { type: string }
        safe_error_message: { type: string }
        created_at: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    Document:
      type: object
      additionalProperties: false
      required:
        [
          id,
          original_name,
          declared_mime,
          detected_mime,
          size_bytes,
          sha256,
          page_count,
          status,
          ingestion_kind,
          created_by_user_id,
          created_at,
        ]
      properties:
        id: { type: string, format: uuid }
        original_name: { type: string }
        declared_mime:
          {
            type: string,
            enum: [image/jpeg, image/png, image/webp, application/pdf],
          }
        detected_mime:
          {
            type: string,
            enum: [image/jpeg, image/png, image/webp, application/pdf],
          }
        size_bytes: { type: integer, minimum: 1, maximum: 20971520 }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        page_count: { type: integer, minimum: 1, maximum: 20 }
        status:
          type: string
          enum:
            [
              stored,
              processing,
              needs_review,
              blocked,
              failed,
              completed,
              cancelled,
              rejected,
            ]
        ingestion_kind: { type: string, enum: [upload, email_attachment] }
        created_by_user_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
    ClaimField:
      type: object
      additionalProperties: false
      required: [id, path, value_type, presence, source, evidence]
      properties:
        id: { type: string, format: uuid }
        path: { type: string }
        value_type: { type: string }
        presence: { type: string, enum: [present, absent] }
        value: {}
        normalized_value: {}
        source: { type: string, enum: [ai, user] }
        evidence:
          type: array
          items:
            type: object
            required: [id, page]
            properties:
              id: { type: string, format: uuid }
              page: { type: integer, minimum: 1, maximum: 20 }
              quote: { type: string }
              region: { type: object }
    ValidationResult:
      type: object
      additionalProperties: false
      required: [id, rule_code, severity, status, safe_message]
      properties:
        id: { type: string, format: uuid }
        field_claim_id: { type: string, format: uuid }
        rule_code: { type: string }
        severity: { type: string, enum: [info, warning, error, blocked] }
        status: { type: string, enum: [passed, warning, error, blocked] }
        safe_message: { type: string }
    LinkCandidate:
      type: object
      additionalProperties: false
      required:
        [
          id,
          target_type,
          target_id,
          amount_minor,
          allocated_minor,
          remaining_minor,
          currency,
          business_date,
          display_name,
          available,
          name_exact,
          date_distance_days,
          reason_codes,
        ]
      properties:
        id: { type: string, format: uuid }
        target_type: { type: string, enum: [payment, invoice] }
        target_id: { type: string, format: uuid }
        amount_minor:
          {
            type: integer,
            format: int64,
            minimum: 0,
            maximum: 9007199254740991,
          }
        allocated_minor:
          {
            type: integer,
            format: int64,
            minimum: 0,
            maximum: 9007199254740991,
          }
        remaining_minor:
          {
            type: integer,
            format: int64,
            minimum: 0,
            maximum: 9007199254740991,
          }
        currency: { $ref: "#/components/schemas/Currency" }
        business_date: { type: string, format: date }
        display_name: { type: string }
        available: { type: boolean }
        name_exact: { type: boolean }
        date_distance_days: { type: integer, minimum: 0, maximum: 30 }
        reason_codes:
          type: array
          items: { type: string }
    DuplicateCandidate:
      type: object
      additionalProperties: false
      required: [id, kind, display_name, available, reason_codes]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [near_file, cross_page, field_combination] }
        existing_document_id: { type: string, format: uuid }
        existing_payment_id: { type: string, format: uuid }
        existing_invoice_id: { type: string, format: uuid }
        display_name: { type: string }
        business_date: { type: string, format: date }
        amount_minor:
          {
            type: integer,
            format: int64,
            minimum: 0,
            maximum: 9007199254740991,
          }
        current_page_number: { type: integer, minimum: 1, maximum: 20 }
        existing_page_number: { type: integer, minimum: 1, maximum: 20 }
        dhash_distance: { type: integer, minimum: 0, maximum: 3 }
        ahash_distance: { type: integer, minimum: 0, maximum: 3 }
        available: { type: boolean }
        reason_codes:
          type: array
          minItems: 1
          items: { type: string }
    ReviewPage:
      type: object
      additionalProperties: false
      required: [page_number, field_paths, item_keys]
      properties:
        page_number: { type: integer, minimum: 1, maximum: 20 }
        field_paths:
          type: array
          items: { type: string }
        item_keys:
          type: array
          items: { type: string, format: uuid }
    InvoiceItemPageSpan:
      type: object
      additionalProperties: false
      required: [item_key, sort_order, page_numbers, cross_page]
      properties:
        item_key: { type: string, format: uuid }
        sort_order: { type: integer, minimum: 0 }
        page_numbers:
          type: array
          maxItems: 20
          items: { type: integer, minimum: 1, maximum: 20 }
        start_page: { type: integer, minimum: 1, maximum: 20 }
        end_page: { type: integer, minimum: 1, maximum: 20 }
        cross_page: { type: boolean }
    Review:
      type: object
      additionalProperties: false
      required:
        [
          job,
          entry_mode,
          claim_set_id,
          document_type,
          revision,
          optimistic_version,
          claim_status,
          page_count,
          pages,
          invoice_item_spans,
          fields,
          validations,
          candidates,
          duplicate_candidates,
        ]
      properties:
        job: { $ref: "#/components/schemas/JobSummary" }
        entry_mode: { type: string, enum: [ai, manual], readOnly: true }
        claim_set_id: { type: string, format: uuid }
        document_type: { type: string, enum: [payment, invoice, trip, unknown] }
        revision: { type: integer, minimum: 1 }
        optimistic_version: { type: integer, minimum: 1 }
        claim_status:
          {
            type: string,
            enum:
              [
                draft,
                ready_for_review,
                blocked,
                superseded,
                confirmed,
                rejected,
                cancelled,
              ],
          }
        page_count: { type: integer, minimum: 1, maximum: 20 }
        pages:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: "#/components/schemas/ReviewPage" }
        invoice_item_spans:
          type: array
          items: { $ref: "#/components/schemas/InvoiceItemPageSpan" }
        fields:
          type: array
          items: { $ref: "#/components/schemas/ClaimField" }
        validations:
          type: array
          items: { $ref: "#/components/schemas/ValidationResult" }
        candidates:
          type: array
          items: { $ref: "#/components/schemas/LinkCandidate" }
        duplicate_candidates:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/DuplicateCandidate" }
    ManualReviewRequest:
      type: object
      additionalProperties: false
      required: [expected_job_version, document_type, reason]
      properties:
        expected_job_version: { type: integer, minimum: 1 }
        document_type: { type: string, enum: [payment, invoice, trip] }
        reason: { type: string, minLength: 1, maxLength: 500 }
    ManualReviewResult:
      type: object
      additionalProperties: false
      required: [job_id, claim_set_id, replayed]
      properties:
        job_id: { type: string, format: uuid }
        claim_set_id: { type: string, format: uuid }
        replayed: { type: boolean }
    RevisionRequest:
      type: object
      additionalProperties: false
      required:
        [expected_revision, expected_optimistic_version, document_type, fields]
      properties:
        expected_revision: { type: integer, minimum: 1 }
        expected_optimistic_version: { type: integer, minimum: 1 }
        document_type: { type: string, enum: [payment, invoice, trip, unknown] }
        fields:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [path, value_type, presence]
            properties:
              path: { type: string }
              value_type: { type: string }
              presence: { type: string, enum: [present, absent] }
              value: {}
              evidence_ids:
                type: array
                items: { type: string, format: uuid }
              manual_evidence:
                type: array
                maxItems: 8
                description: 仅人工来源审核可提交；用户显式标注，不能由字段值自动生成摘录
                items:
                  type: object
                  additionalProperties: false
                  required: [page, quote]
                  properties:
                    page: { type: integer, minimum: 1, maximum: 20 }
                    quote: { type: string, minLength: 1, maxLength: 500 }
    ConfirmRequest:
      type: object
      additionalProperties: false
      required: [expected_revision, duplicate_resolutions]
      description: Payment/Invoice 必须提交 association_mode 与 allocations；Trip 禁止提交这两个成员。
      properties:
        expected_revision: { type: integer, minimum: 1 }
        association_mode:
          {
            type: string,
            enum: [allocate_candidates, reject_all, no_candidate],
          }
        allocations:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [candidate_id, allocated_minor]
            properties:
              candidate_id: { type: string, format: uuid }
              allocated_minor:
                {
                  type: integer,
                  format: int64,
                  minimum: 1,
                  maximum: 9007199254740991,
                }
        duplicate_resolutions:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [candidate_id, action]
            properties:
              candidate_id: { type: string, format: uuid }
              action: { const: keep_distinct }
    ConfirmResult:
      type: object
      additionalProperties: false
      required: [review_decision_id, fact_type, fact_id, link_ids, replayed]
      properties:
        review_decision_id: { type: string, format: uuid }
        fact_type: { type: string, enum: [payment, invoice, trip] }
        fact_id: { type: string, format: uuid }
        link_ids:
          type: array
          items: { type: string, format: uuid }
        replayed: { type: boolean }
    AllocationFactType:
      type: string
      enum: [payment, invoice]
    InsightFactTypeFilter:
      type: string
      enum: [all, payment, invoice]
    InsightAllocationStatusFilter:
      type: string
      enum: [all, unallocated, partial, allocated]
    InsightTripScope:
      type: string
      enum: [all, assigned, unassigned]
    InsightFilter:
      type: object
      additionalProperties: false
      required: [fact_type, allocation_status, trip_scope]
      properties:
        fact_type: { $ref: "#/components/schemas/InsightFactTypeFilter" }
        date_from: { type: string, format: date }
        date_to: { type: string, format: date }
        currency: { $ref: "#/components/schemas/Currency" }
        allocation_status:
          { $ref: "#/components/schemas/InsightAllocationStatusFilter" }
        trip_scope: { $ref: "#/components/schemas/InsightTripScope" }
        trip_id: { type: string, format: uuid }
    InsightTrip:
      type: object
      additionalProperties: false
      required: [id, name, start_date, end_date]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 500 }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
    InsightFact:
      type: object
      additionalProperties: false
      required:
        [
          fact_type,
          fact_id,
          business_date,
          display_name,
          amount_minor,
          allocated_minor,
          remaining_minor,
          currency,
          allocation_status,
        ]
      properties:
        fact_type: { $ref: "#/components/schemas/AllocationFactType" }
        fact_id: { type: string, format: uuid }
        business_date: { type: string, format: date }
        display_name: { type: string, minLength: 1 }
        amount_minor:
          {
            type: integer,
            format: int64,
            minimum: 0,
            maximum: 9007199254740991,
          }
        allocated_minor:
          {
            type: integer,
            format: int64,
            minimum: 0,
            maximum: 9007199254740991,
          }
        remaining_minor:
          {
            type: integer,
            format: int64,
            minimum: 0,
            maximum: 9007199254740991,
          }
        currency: { $ref: "#/components/schemas/Currency" }
        allocation_status:
          { type: string, enum: [unallocated, partial, allocated] }
        trip: { $ref: "#/components/schemas/InsightTrip" }
    InsightAggregate:
      type: object
      additionalProperties: false
      required:
        [
          currency,
          fact_type,
          count,
          total_minor,
          allocated_minor,
          remaining_minor,
          unallocated_count,
          partial_count,
          allocated_count,
        ]
      properties:
