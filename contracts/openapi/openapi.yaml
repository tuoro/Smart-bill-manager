        materials:
          type: array
          maxItems: 20000
          items: { $ref: "#/components/schemas/ReimbursementMaterial" }
        trip: { $ref: "#/components/schemas/ReimbursementTripSnapshot" }
        items:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: "#/components/schemas/ReimbursementPolicyItem" }
        findings:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/ReimbursementPolicyFinding" }
        totals_by_currency:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ReimbursementCurrencyTotal" }
        snapshot_hash: { type: string, pattern: "^[a-f0-9]{64}$" }
    ReimbursementPreviewRequest:
      type: object
      additionalProperties: false
