openapi: 3.1.0
info:
  title: Smart Bill Manager API
  version: 1.0.0-m3
  description: Clean Slate M3 API。所有租户资源均从服务端会话解析 TenantContext。
servers:
  - url: /api/v1
security:
  - sessionCookie: []
tags:
  - name: session
  - name: documents
  - name: jobs
  - name: reviews
  - name: facts
  - name: allocations
  - name: trips
  - name: reimbursements
  - name: providers
  - name: email
paths:
  /health:
    get:
      operationId: getHealth
      security: []
      responses:
        "200":
          description: 服务健康
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /ready:
    get:
      operationId: getReadiness
      security: []
      responses:
        "200":
          description: 数据库与任务调度器均已就绪
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          $ref: "#/components/responses/Unavailable"
  /session/login:
    post:
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功；同时设置 HttpOnly 会话 Cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /session:
    get:
      operationId: getSession
      responses:
        "200":
          description: 当前会话
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: logout
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: 会话已撤销
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /email-sources:
    get:
      operationId: listEmailSources
      tags: [email]
      responses:
        "200":
          description: 当前租户内的无凭据邮箱来源及安全计数
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/EmailSource"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: registerEmailSource
      tags: [email]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailSourceRegistration"
      responses:
        "201":
          description: 无凭据邮箱来源已登记，尚未建立真实连接
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailSource"
        "200":
          description: 相同幂等键与相同规范请求的稳定重放
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailSource"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /email-sources/{source_id}/messages:
    get:
      operationId: listEmailMessages
      tags: [email]
      parameters:
        - $ref: "#/components/parameters/EmailSourceId"
        - name: cursor
          in: query
          schema: { type: string, minLength: 1, maxLength: 1024 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: 不含正文、原始头、外部键或存储键的稳定游标邮件页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailMessagePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /email-messages/{message_id}/raw:
    get:
      operationId: downloadEmailMessage
      tags: [email]
      parameters:
        - $ref: "#/components/parameters/EmailMessageId"
      responses:
        "200":
          description: 强制下载且不缓存的原始 RFC 822 邮件
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            message/rfc822: {}
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /email-attachments/{attachment_id}/content:
    get:
      operationId: downloadEmailAttachment
      tags: [email]
      parameters:
        - $ref: "#/components/parameters/EmailAttachmentId"
      responses:
        "200":
          description: 强制下载且不缓存的不可变邮件附件
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            application/octet-stream: {}
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /documents:
    post:
      operationId: uploadDocument
      tags: [documents]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: 原件与 Job 已原子登记
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
  /documents/{document_id}/content:
    get:
      operationId: downloadDocument
      tags: [documents]
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: 鉴权后的原始文件
          content:
            image/jpeg: {}
            image/png: {}
            image/webp: {}
            application/pdf: {}
        "404":
          $ref: "#/components/responses/NotFound"
  /documents/{document_id}/pages/{page_number}/content:
    get:
      operationId: downloadDocumentPage
      tags: [documents]
      parameters:
        - $ref: "#/components/parameters/DocumentId"
        - name: page_number
          in: path
          required: true
          schema: { type: integer, minimum: 1, maximum: 20 }
      responses:
        "200":
          description: 鉴权后的规范化单页 PNG，仅供证据分页审核
          content:
            image/png: {}
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /documents/{document_id}:
    get:
      operationId: getDocument
      tags: [documents]
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: 当前租户内的 Document 不可变元数据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteDocument
      tags: [documents]
      parameters:
        - $ref: "#/components/parameters/DocumentId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: 未形成 Fact 的 Document 聚合及对象已物理删除，只保留无财务内容墓碑
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum:
              [
                queued,
                processing,
                needs_review,
                blocked,
                failed,
                cancel_requested,
                cancelled,
                completed,
                rejected,
              ]
      responses:
        "200":
          description: 当前租户收件箱
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/JobSummary"
  /jobs/{job_id}:
    get:
      operationId: getJob
      tags: [jobs]
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Job 详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobSummary"
        "404":
          $ref: "#/components/responses/NotFound"
  /jobs/{job_id}/cancel:
    post:
      operationId: cancelJob
      tags: [jobs]
      parameters:
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: 取消已登记
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobSummary"
        "409":
          $ref: "#/components/responses/Conflict"
  /jobs/{job_id}/retry:
    post:
      operationId: retryJob
      tags: [jobs]
      parameters:
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: 无 ClaimSet 的失败 Job 已重新入队
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobSummary"
        "409":
          $ref: "#/components/responses/Conflict"
  /reviews/{job_id}:
    get:
      operationId: getReview
      tags: [reviews]
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: 当前完整 Claim revision、证据、校验和候选
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "404":
          $ref: "#/components/responses/NotFound"
  /claim-sets/{claim_set_id}:
    get:
      operationId: getClaimSet
      tags: [reviews]
      parameters:
        - $ref: "#/components/parameters/ClaimSetId"
      responses:
        "200":
          description: 指定不可变 ClaimSet revision、证据、校验和候选
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "404":
          $ref: "#/components/responses/NotFound"
  /reviews/{job_id}/revisions:
    post:
      operationId: reviseClaim
      tags: [reviews]
      parameters:
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevisionRequest"
      responses:
        "201":
          description: 新完整 revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "409":
          $ref: "#/components/responses/Conflict"
  /reviews/{job_id}/confirm:
    post:
      operationId: confirmReview
      tags: [reviews]
      parameters:
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmRequest"
      responses:
        "200":
          description: 幂等重放或首次确认结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmResult"
        "409":
          $ref: "#/components/responses/Conflict"
  /reviews/{job_id}/reject:
    post:
      operationId: rejectReview
      tags: [reviews]
      parameters:
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_revision]
              properties:
                expected_revision:
                  type: integer
                  minimum: 1
                reason:
                  type: string
                  maxLength: 500
      responses:
        "204":
          description: Claim 已拒绝且未创建 Fact
        "409":
          $ref: "#/components/responses/Conflict"
  /payments:
    get:
      operationId: listPayments
      tags: [facts]
      responses:
        "200":
          description: 未删除 Payment
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Payment"
  /payments/{payment_id}:
    delete:
      operationId: deletePayment
      tags: [facts]
      parameters:
        - $ref: "#/components/parameters/PaymentId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Payment 已标记删除，活动关联已在同一事务中终止
        "404":
          $ref: "#/components/responses/NotFound"
  /invoices:
    get:
      operationId: listInvoices
      tags: [facts]
      responses:
        "200":
          description: 未删除 Invoice
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Invoice"
  /invoices/{invoice_id}:
    delete:
      operationId: deleteInvoice
      tags: [facts]
      parameters:
        - $ref: "#/components/parameters/InvoiceId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Invoice 已标记删除，活动关联已在同一事务中终止
        "404":
          $ref: "#/components/responses/NotFound"
  /trips:
    get:
      operationId: listTrips
      tags: [trips]
      responses:
        "200":
          description: 未删除 Trip 及当前活动归属计数
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Trip"
        "403":
          $ref: "#/components/responses/Forbidden"
  /trips/{trip_id}:
    delete:
      operationId: deleteTrip
      tags: [trips]
      parameters:
        - $ref: "#/components/parameters/TripId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Trip 已标记删除，相关活动归属已在同一事务中终止
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /trips/{trip_id}/attribution-candidates:
    get:
      operationId: listTripAttributionCandidates
      tags: [trips]
      parameters:
        - $ref: "#/components/parameters/TripId"
        - name: view
          in: query
          schema:
            $ref: "#/components/schemas/TripAttributionView"
        - name: cursor
          in: query
          schema: { type: string, minLength: 1, maxLength: 1024 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: 版本化确定性建议、当前归属与全部可选 Fact 的稳定游标页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripAttributionPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /trip-assignments:
    post:
      operationId: changeTripAssignment
      tags: [trips]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TripAssignmentRequest"
      responses:
        "200":
          description: assign、move、unassign 或严格幂等重放结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripAssignmentResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /reimbursement-previews:
    post:
      operationId: previewReimbursement
      tags: [reimbursements]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReimbursementPreviewRequest"
      responses:
        "200":
          description: 基于当前活动 Trip 归属、分配 Link 与既有报销状态确定性计算的非持久化快照
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReimbursementPolicySnapshot"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /reimbursements:
    get:
      operationId: listReimbursements
      tags: [reimbursements]
      parameters:
        - name: cursor
          in: query
          schema: { type: string, minLength: 1, maxLength: 1024 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: 当前租户内不可变报销快照的稳定游标页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReimbursementPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: submitReimbursement
      tags: [reimbursements]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReimbursementSubmissionRequest"
      responses:
        "201":
          description: 当前选择与完整政策提示已原子快照并提交
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReimbursementMutationResult"
        "200":
          description: 相同幂等键与规范请求的稳定重放
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReimbursementMutationResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /reimbursements/{reimbursement_id}:
    get:
      operationId: getReimbursement
      tags: [reimbursements]
      parameters:
        - $ref: "#/components/parameters/ReimbursementId"
      responses:
        "200":
          description: 报销快照、确定性提示与完整状态决定历史
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReimbursementDetail"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /reimbursements/{reimbursement_id}/status-decisions:
    post:
      operationId: changeReimbursementStatus
      tags: [reimbursements]
      parameters:
        - $ref: "#/components/parameters/ReimbursementId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReimbursementStatusRequest"
      responses:
        "200":
          description: 状态已按期望版本转换，或返回相同幂等请求的稳定结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReimbursementMutationResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /allocations/{fact_type}/{fact_id}:
    get:
      operationId: getAllocationWorkspace
      tags: [allocations]
      parameters:
        - name: fact_type
          in: path
          required: true
          schema: { $ref: "#/components/schemas/AllocationFactType" }
        - name: fact_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: 已确认 Fact 的当前活动分配计划与合格目标
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllocationWorkspace"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /allocations/{fact_type}/{fact_id}/adjustments:
    post:
      operationId: adjustAllocation
      tags: [allocations]
      parameters:
        - name: fact_type
          in: path
          required: true
          schema: { $ref: "#/components/schemas/AllocationFactType" }
        - name: fact_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AllocationAdjustmentRequest"
      responses:
        "200":
          description: 首次调整或严格幂等重放结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllocationAdjustmentResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /provider-configs:
    get:
      operationId: listProviderConfigs
      tags: [providers]
      responses:
        "200":
          description: 不含可恢复密钥材料的配置列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProviderConfig"
    post:
      operationId: createProviderConfig
      tags: [providers]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [base_url, api_key, model, output_mode]
              properties:
                base_url:
                  type: string
                  format: uri
                api_key:
                  type: string
                  minLength: 1
                  maxLength: 4096
                model:
                  type: string
                  minLength: 1
                  maxLength: 200
                output_mode:
                  type: string
                  enum: [json_schema, json_object]
      responses:
        "201":
          description: 待检测配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderConfig"
  /provider-configs/{provider_config_id}/detect:
    post:
      operationId: detectProviderCapabilities
      tags: [providers]
      parameters:
        - $ref: "#/components/parameters/ProviderConfigId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: 能力检测结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderConfig"
  /provider-configs/{provider_config_id}/activate:
    post:
      operationId: activateProviderConfig
      tags: [providers]
      parameters:
        - $ref: "#/components/parameters/ProviderConfigId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: 已激活且检测通过的配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderConfig"
        "409":
          $ref: "#/components/responses/Conflict"
  /provider-configs/{provider_config_id}:
    delete:
      operationId: deleteProviderConfig
      tags: [providers]
      parameters:
        - $ref: "#/components/parameters/ProviderConfigId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: 配置已停用，密文已立即清除并写入审计事件
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sbm_session
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 32
        maxLength: 256
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    DocumentId:
      name: document_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ClaimSetId:
      name: claim_set_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PaymentId:
      name: payment_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvoiceId:
      name: invoice_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TripId:
      name: trip_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReimbursementId:
      name: reimbursement_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProviderConfigId:
      name: provider_config_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EmailSourceId:
      name: source_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EmailMessageId:
      name: message_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EmailAttachmentId:
      name: attachment_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: 输入不合法
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: 未认证
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: 权限或 CSRF 校验失败
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: 资源不存在或对当前租户不可见
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: 幂等、版本、重复或状态冲突
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: 请求载荷超过对应接口限制
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: 服务尚未就绪
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        status:
          const: ok
        version:
          type: string
    Readiness:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        status:
          const: ready
        version:
          type: string
    Error:
      $ref: ../schemas/error.schema.json
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 1024
        tenant_id:
          type: string
          format: uuid
    Session:
      type: object
      additionalProperties: false
      required: [user, tenant, role, capabilities, csrf_token, expires_at]
      properties:
        user:
          $ref: "#/components/schemas/User"
        tenant:
          $ref: "#/components/schemas/Tenant"
        role:
          $ref: "#/components/schemas/Role"
        capabilities:
          type: array
          items:
            type: string
          uniqueItems: true
        csrf_token:
          type: string
        expires_at:
          type: string
          format: date-time
    User:
      type: object
      additionalProperties: false
      required: [id, email, display_name]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
    Tenant:
      type: object
      additionalProperties: false
      required: [id, name, default_currency, timezone]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        default_currency: { $ref: "#/components/schemas/Currency" }
        timezone: { type: string }
    Role:
      type: string
      enum: [owner, finance, reviewer, viewer]
    Currency:
      type: string
      enum: [CNY, USD, EUR, JPY]
    UploadResult:
      type: object
      additionalProperties: false
      required: [document_id, job_id, status, sha256]
      properties:
        document_id: { type: string, format: uuid }
        job_id: { type: string, format: uuid }
        status: { const: queued }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
    EmailSourceRegistration:
      type: object
      additionalProperties: false
      required:
        [
          display_name,
          mailbox_address,
          imap_host,
          imap_port,
          transport_security,
        ]
      properties:
        display_name: { type: string, minLength: 1, maxLength: 100 }
        mailbox_address:
          { type: string, format: email, minLength: 3, maxLength: 254 }
        imap_host: { type: string, minLength: 1, maxLength: 253 }
        imap_port: { type: integer, minimum: 1, maximum: 65535 }
        transport_security:
          type: string
          enum: [implicit_tls, starttls]
    EmailSource:
      type: object
      additionalProperties: false
      required:
        - id
        - display_name
        - mailbox_address
        - imap_host
        - imap_port
        - transport_security
        - status
        - created_by_user_id
        - created_at
        - version
        - message_count
        - attachment_count
        - blocked_count
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string, minLength: 1, maxLength: 100 }
        mailbox_address: { type: string, format: email, maxLength: 254 }
        imap_host: { type: string, maxLength: 253 }
        imap_port: { type: integer, minimum: 1, maximum: 65535 }
        transport_security:
          type: string
          enum: [implicit_tls, starttls]
        status:
          type: string
          enum: [pending_connection, active]
        created_by_user_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        last_archived_at: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
        message_count: { type: integer, minimum: 0 }
        attachment_count: { type: integer, minimum: 0 }
        blocked_count: { type: integer, minimum: 0 }
    EmailMessagePage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EmailMessage"
        next_cursor: { type: string, minLength: 1, maxLength: 1024 }
    EmailMessage:
      type: object
      additionalProperties: false
      required:
        - id
        - email_source_id
        - subject
        - sender_address
        - received_at
        - status
        - created_at
        - attachments
      properties:
        id: { type: string, format: uuid }
        email_source_id: { type: string, format: uuid }
        subject: { type: string, maxLength: 500 }
        sender_address: { type: string, maxLength: 254 }
        sent_at: { type: string, format: date-time }
        received_at: { type: string, format: date-time }
        status: { type: string, enum: [archived, blocked] }
        safe_error_code: { type: string, maxLength: 100 }
        safe_error_text: { type: string, maxLength: 200 }
        created_at: { type: string, format: date-time }
        attachments:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/EmailAttachment"
    EmailAttachment:
      type: object
      additionalProperties: false
      required:
        - id
        - part_index
        - original_name
        - declared_mime
        - disposition
        - size_bytes
        - processing_status
      properties:
        id: { type: string, format: uuid }
        part_index: { type: integer, minimum: 1, maximum: 50 }
        original_name: { type: string, minLength: 1, maxLength: 200 }
        declared_mime: { type: string, minLength: 1, maxLength: 200 }
        disposition: { type: string, enum: [attachment, inline] }
        size_bytes:
          { type: integer, format: int64, minimum: 0, maximum: 33554432 }
        processing_status:
          type: string
          enum: [queued, existing_document, archived_only]
        safe_reason_code: { type: string, minLength: 1, maxLength: 100 }
        document_id: { type: string, format: uuid }
        job_id: { type: string, format: uuid }
    JobSummary:
      type: object
      additionalProperties: false
      required:
        [
          id,
          document_id,
          original_name,
          ingestion_kind,
          detected_mime,
          status,
          attempt_count,
          created_at,
          version,
        ]
      properties:
        id: { type: string, format: uuid }
        document_id: { type: string, format: uuid }
        original_name: { type: string }
        ingestion_kind: { type: string, enum: [upload, email_attachment] }
        detected_mime: { type: string }
        status:
          type: string
          enum:
            [
              queued,
              processing,
              needs_review,
              blocked,
              failed,
              cancel_requested,
              cancelled,
              completed,
              rejected,
            ]
        attempt_count: { type: integer, minimum: 0 }
        error_code: { type: string }
        safe_error_message: { type: string }
        created_at: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    Document:
      type: object
      additionalProperties: false
      required:
        [
          id,
          original_name,
          declared_mime,
          detected_mime,
          size_bytes,
          sha256,
          page_count,
          status,
          ingestion_kind,
          created_by_user_id,
          created_at,
        ]
      properties:
        id: { type: string, format: uuid }
        original_name: { type: string }
        declared_mime:
          {
            type: string,
            enum: [image/jpeg, image/png, image/webp, application/pdf],
          }
        detected_mime:
          {
            type: string,
            enum: [image/jpeg, image/png, image/webp, application/pdf],
          }
        size_bytes: { type: integer, minimum: 1, maximum: 20971520 }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        page_count: { type: integer, minimum: 1, maximum: 20 }
        status:
          type: string
          enum:
            [
              stored,
              processing,
              needs_review,
              blocked,
              failed,
              completed,
              cancelled,
              rejected,
            ]
        ingestion_kind: { type: string, enum: [upload, email_attachment] }
        created_by_user_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
    ClaimField:
      type: object
      additionalProperties: false
      required: [id, path, value_type, presence, source, evidence]
      properties:
        id: { type: string, format: uuid }
        path: { type: string }
        value_type: { type: string }
        presence: { type: string, enum: [present, absent] }
        value: {}
        normalized_value: {}
        source: { type: string, enum: [ai, user] }
        evidence:
          type: array
          items:
            type: object
            required: [id, page]
            properties:
              id: { type: string, format: uuid }
              page: { type: integer, minimum: 1, maximum: 20 }
              quote: { type: string }
              region: { type: object }
    ValidationResult:
      type: object
      additionalProperties: false
      required: [id, rule_code, severity, status, safe_message]
      properties:
        id: { type: string, format: uuid }
        field_claim_id: { type: string, format: uuid }
        rule_code: { type: string }
        severity: { type: string, enum: [info, warning, error, blocked] }
        status: { type: string, enum: [passed, warning, error, blocked] }
        safe_message: { type: string }
    LinkCandidate:
      type: object
      additionalProperties: false
      required:
        [
          id,
          target_type,
          target_id,
          amount_minor,
          allocated_minor,
          remaining_minor,
          currency,
          business_date,
          display_name,
          available,
          name_exact,
          date_distance_days,
          reason_codes,
        ]
      properties:
        id: { type: string, format: uuid }
        target_type: { type: string, enum: [payment, invoice] }
        target_id: { type: string, format: uuid }
        amount_minor:
          {
            type: integer,
            format: int64,
            minimum: 0,
            maximum: 9007199254740991,
          }
        allocated_minor:
          {
            type: integer,
            format: int64,
            minimum: 0,
            maximum: 9007199254740991,
          }
        remaining_minor:
          {
            type: integer,
            format: int64,
            minimum: 0,
            maximum: 9007199254740991,
          }
        currency: { $ref: "#/components/schemas/Currency" }
        business_date: { type: string, format: date }
        display_name: { type: string }
        available: { type: boolean }
        name_exact: { type: boolean }
        date_distance_days: { type: integer, minimum: 0, maximum: 30 }
        reason_codes:
          type: array
          items: { type: string }
    DuplicateCandidate:
      type: object
      additionalProperties: false
      required: [id, kind, display_name, available, reason_codes]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [near_file, cross_page, field_combination] }
        existing_document_id: { type: string, format: uuid }
        existing_payment_id: { type: string, format: uuid }
        existing_invoice_id: { type: string, format: uuid }
        display_name: { type: string }
        business_date: { type: string, format: date }
        amount_minor:
          {
            type: integer,
            format: int64,
            minimum: 0,
            maximum: 9007199254740991,
          }
        current_page_number: { type: integer, minimum: 1, maximum: 20 }
        existing_page_number: { type: integer, minimum: 1, maximum: 20 }
        dhash_distance: { type: integer, minimum: 0, maximum: 3 }
        ahash_distance: { type: integer, minimum: 0, maximum: 3 }
        available: { type: boolean }
        reason_codes:
          type: array
          minItems: 1
          items: { type: string }
    ReviewPage:
      type: object
      additionalProperties: false
      required: [page_number, field_paths, item_keys]
      properties:
        page_number: { type: integer, minimum: 1, maximum: 20 }
        field_paths:
          type: array
          items: { type: string }
        item_keys:
          type: array
          items: { type: string, format: uuid }
    InvoiceItemPageSpan:
      type: object
      additionalProperties: false
      required: [item_key, sort_order, page_numbers, cross_page]
      properties:
        item_key: { type: string, format: uuid }
        sort_order: { type: integer, minimum: 0 }
        page_numbers:
          type: array
          maxItems: 20
          items: { type: integer, minimum: 1, maximum: 20 }
        start_page: { type: integer, minimum: 1, maximum: 20 }
        end_page: { type: integer, minimum: 1, maximum: 20 }
        cross_page: { type: boolean }
    Review:
      type: object
      additionalProperties: false
      required:
        [
          job,
          claim_set_id,
          document_type,
          revision,
          optimistic_version,
          claim_status,
          page_count,
          pages,
          invoice_item_spans,
          fields,
          validations,
          candidates,
          duplicate_candidates,
        ]
      properties:
        job: { $ref: "#/components/schemas/JobSummary" }
        claim_set_id: { type: string, format: uuid }
        document_type: { type: string, enum: [payment, invoice, trip, unknown] }
        revision: { type: integer, minimum: 1 }
        optimistic_version: { type: integer, minimum: 1 }
        claim_status:
          {
            type: string,
            enum:
              [
                draft,
                ready_for_review,
                blocked,
                superseded,
                confirmed,
                rejected,
                cancelled,
              ],
          }
        page_count: { type: integer, minimum: 1, maximum: 20 }
        pages:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: "#/components/schemas/ReviewPage" }
        invoice_item_spans:
          type: array
          items: { $ref: "#/components/schemas/InvoiceItemPageSpan" }
        fields:
          type: array
          items: { $ref: "#/components/schemas/ClaimField" }
        validations:
          type: array
          items: { $ref: "#/components/schemas/ValidationResult" }
        candidates:
          type: array
          items: { $ref: "#/components/schemas/LinkCandidate" }
        duplicate_candidates:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/DuplicateCandidate" }
    RevisionRequest:
      type: object
      additionalProperties: false
      required:
        [expected_revision, expected_optimistic_version, document_type, fields]
      properties:
        expected_revision: { type: integer, minimum: 1 }
        expected_optimistic_version: { type: integer, minimum: 1 }
        document_type: { type: string, enum: [payment, invoice, trip, unknown] }
        fields:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [path, value_type, presence]
            properties:
              path: { type: string }
              value_type: { type: string }
              presence: { type: string, enum: [present, absent] }
              value: {}
              evidence_ids:
                type: array
                items: { type: string, format: uuid }
    ConfirmRequest:
      type: object
      additionalProperties: false
      required: [expected_revision, duplicate_resolutions]
      description: Payment/Invoice 必须提交 association_mode 与 allocations；Trip 禁止提交这两个成员。
      properties:
        expected_revision: { type: integer, minimum: 1 }
        association_mode:
          {
            type: string,
            enum: [allocate_candidates, reject_all, no_candidate],
          }
        allocations:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [candidate_id, allocated_minor]
            properties:
              candidate_id: { type: string, format: uuid }
              allocated_minor:
                {
                  type: integer,
                  format: int64,
                  minimum: 1,
                  maximum: 9007199254740991,
                }
        duplicate_resolutions:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [candidate_id, action]
            properties:
              candidate_id: { type: string, format: uuid }
              action: { const: keep_distinct }
    ConfirmResult:
      type: object
      additionalProperties: false
      required: [review_decision_id, fact_type, fact_id, link_ids, replayed]
      properties:
        review_decision_id: { type: string, format: uuid }
        fact_type: { type: string, enum: [payment, invoice, trip] }
        fact_id: { type: string, format: uuid }
        link_ids:
          type: array
          items: { type: string, format: uuid }
        replayed: { type: boolean }
    AllocationFactType:
      type: string
      enum: [payment, invoice]
    AllocationFactSummary:
      type: object
      additionalProperties: false
      required:
        [
          fact_type,
          id,
          amount_minor,
          allocated_minor,
          remaining_minor,
          currency,
          business_date,
          display_name,
        ]
      properties:
        fact_type: { $ref: "#/components/schemas/AllocationFactType" }
        id: { type: string, format: uuid }
        amount_minor:
          {
            type: integer,
            format: int64,
            minimum: 0,
            maximum: 9007199254740991,
          }
        allocated_minor:
          {
            type: integer,
            format: int64,
            minimum: 0,
            maximum: 9007199254740991,
          }
        remaining_minor:
          {
            type: integer,
            format: int64,
            minimum: 0,
            maximum: 9007199254740991,
          }
        currency: { $ref: "#/components/schemas/Currency" }
        business_date: { type: string, format: date }
        display_name: { type: string }
    AllocationWorkspaceLink:
      type: object
      additionalProperties: false
      required:
        [
          id,
          target_fact_type,
          target_fact_id,
          allocated_minor,
          currency,
          created_at,
        ]
      properties:
        id: { type: string, format: uuid }
        target_fact_type: { $ref: "#/components/schemas/AllocationFactType" }
        target_fact_id: { type: string, format: uuid }
        allocated_minor:
          {
            type: integer,
            format: int64,
            minimum: 1,
            maximum: 9007199254740991,
          }
        currency: { $ref: "#/components/schemas/Currency" }
        created_at: { type: string, format: date-time }
    AllocationTarget:
      type: object
      additionalProperties: false
      required:
        [
          fact_type,
          id,
          amount_minor,
          allocated_minor,
          remaining_minor,
          currency,
          business_date,
          display_name,
          name_exact,
          date_distance_days,
          current_allocated_minor,
          maximum_allocatable_minor,
        ]
      properties:
        fact_type: { $ref: "#/components/schemas/AllocationFactType" }
        id: { type: string, format: uuid }
        amount_minor:
          {
            type: integer,
            format: int64,
            minimum: 1,
            maximum: 9007199254740991,
          }
        allocated_minor:
          {
            type: integer,
            format: int64,
            minimum: 0,
            maximum: 9007199254740991,
          }
        remaining_minor:
          {
            type: integer,
            format: int64,
            minimum: 0,
            maximum: 9007199254740991,
          }
        currency: { $ref: "#/components/schemas/Currency" }
        business_date: { type: string, format: date }
        display_name: { type: string }
        name_exact: { type: boolean }
        date_distance_days: { type: integer, minimum: 0, maximum: 30 }
        current_link_id: { type: string, format: uuid }
        current_allocated_minor:
          {
            type: integer,
            format: int64,
            minimum: 0,
            maximum: 9007199254740991,
          }
