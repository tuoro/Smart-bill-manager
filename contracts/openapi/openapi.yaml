        version: { type: integer, minimum: 1 }
        replayed: { type: boolean }
    ProviderConfig:
      type: object
      additionalProperties: false
      required:
        [
          id,
          base_url,
          model,
          output_mode,
          capability_status,
          active,
          version,
          safe_fingerprint,
        ]
      properties:
        id: { type: string, format: uuid }
        base_url: { type: string, format: uri }
        model: { type: string }
        output_mode: { type: string, enum: [json_schema, json_object] }
        capability_status: { type: string, enum: [pending, passed, failed] }
