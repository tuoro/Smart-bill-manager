.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;sbm02-four-pages&#x27;);
      if (!root) return;

      const themeButton = root.querySelector(&#x27;[data-theme-cycle]&#x27;);
      const themeModes = [&#x27;auto&#x27;, &#x27;dark&#x27;, &#x27;light&#x27;];
      let themeIndex = 0;
      const themeLabels = {
        auto: &#x27;外观：跟随系统&#x27;,
        dark: &#x27;外观：深色&#x27;,
        light: &#x27;外观：浅色&#x27;
      };

      if (themeButton) {
        themeButton.addEventListener(&#x27;click&#x27;, () =&gt; {
          themeIndex = (themeIndex + 1) % themeModes.length;
          const mode = themeModes[themeIndex];
          if (mode === &#x27;auto&#x27;) delete root.dataset.previewTheme;
          else root.dataset.previewTheme = mode;
          themeButton.textContent = themeLabels[mode];
        });
      }

      const setScenario = (page, state) =&gt; {
        const pageWindow = root.querySelector(`[data-page-window=&quot;${page}&quot;]`);
        if (!pageWindow) return;
        pageWindow.dataset.state = state;
        root.querySelectorAll(`[data-scenario-page=&quot;${page}&quot;]`).forEach((button) =&gt; {
          button.setAttribute(&#x27;aria-pressed&#x27;, String(button.dataset.scenarioState === state));
        });

        pageWindow.querySelectorAll(&#x27;[data-state-only]&#x27;).forEach((view) =&gt; {
          view.hidden = view.dataset.stateOnly !== state;
        });

        if (page === &#x27;login&#x27;) {
          const error = pageWindow.querySelector(&#x27;[data-login-error]&#x27;);
          const denied = pageWindow.querySelector(&#x27;[data-login-denied]&#x27;);
          const email = pageWindow.querySelector(&#x27;[data-login-email]&#x27;);
          const password = pageWindow.querySelector(&#x27;[data-login-password]&#x27;);
          const submit = pageWindow.querySelector(&#x27;[data-login-submit]&#x27;);
          if (error) error.hidden = state !== &#x27;error&#x27;;
          if (denied) denied.hidden = state !== &#x27;denied&#x27;;
          if (email) email.setAttribute(&#x27;aria-invalid&#x27;, String(state === &#x27;error&#x27;));
          if (password) password.setAttribute(&#x27;aria-invalid&#x27;, String(state === &#x27;error&#x27;));
          if (submit) {
            submit.disabled = state === &#x27;loading&#x27; || state === &#x27;denied&#x27;;
            submit.textContent = state === &#x27;loading&#x27; ? &#x27;正在验证…&#x27; : &#x27;登录&#x27;;
          }
        }

        if (page === &#x27;review&#x27;) {
          const normal = pageWindow.querySelector(&#x27;[data-review-content=&quot;normal&quot;]&#x27;);
          const loading = pageWindow.querySelector(&#x27;[data-review-content=&quot;loading&quot;]&#x27;);
          const status = pageWindow.querySelector(&#x27;[data-review-status] span&#x27;);
          const confirm = pageWindow.querySelector(&#x27;[data-review-confirm]&#x27;);
          const summary = pageWindow.querySelector(&#x27;[data-review-summary]&#x27;);
          let linkChoice = pageWindow.querySelector(&#x27;input[name=&quot;sbm02-link-choice&quot;]:checked&#x27;)?.value;
          if (state === &#x27;completed&#x27; &amp;&amp; !linkChoice) {
            const accepted = pageWindow.querySelector(&#x27;input[name=&quot;sbm02-link-choice&quot;][value=&quot;accept&quot;]&#x27;);
            if (accepted) accepted.checked = true;
            linkChoice = &#x27;accept&#x27;;
          }
          const reviewStep = pageWindow.querySelector(&#x27;[data-review-step=&quot;review&quot;]&#x27;);
          const factStep = pageWindow.querySelector(&#x27;[data-review-step=&quot;fact&quot;]&#x27;);
          pageWindow.querySelectorAll(&#x27;[data-review-banner]&#x27;).forEach((banner) =&gt; {
            banner.hidden = banner.dataset.reviewBanner !== state;
          });
          if (normal) normal.hidden = state === &#x27;loading&#x27;;
          if (loading) loading.hidden = state !== &#x27;loading&#x27;;
          if (status) status.textContent = state === &#x27;completed&#x27; ? &#x27;审核通过&#x27; : state === &#x27;blocked&#x27; ? &#x27;已阻断&#x27; : state === &#x27;stale&#x27; ? &#x27;版本冲突&#x27; : state === &#x27;loading&#x27; ? &#x27;加载中&#x27; : &#x27;待审核&#x27;;
          if (confirm) {
            confirm.disabled = state === &#x27;blocked&#x27; || state === &#x27;loading&#x27; || state === &#x27;completed&#x27; || (state === &#x27;default&#x27; &amp;&amp; !linkChoice);
            confirm.textContent = state === &#x27;blocked&#x27; ? &#x27;解决阻断项后确认&#x27; : state === &#x27;stale&#x27; ? &#x27;重新加载最新版本&#x27; : state === &#x27;completed&#x27; ? &#x27;已生成事实&#x27; : state === &#x27;loading&#x27; ? &#x27;正在加载…&#x27; : !linkChoice ? &#x27;请选择关联结果&#x27; : &#x27;确认并生成事实&#x27;;
          }
          if (summary) summary.innerHTML = state === &#x27;blocked&#x27; ? &#x27;&lt;strong&gt;审核结果：&lt;/strong&gt;1 个金额错误阻断提交&#x27; : state === &#x27;stale&#x27; ? &#x27;&lt;strong&gt;审核结果：&lt;/strong&gt;当前修改尚未提交，请先同步版本&#x27; : state === &#x27;completed&#x27; ? linkChoice === &#x27;reject&#x27; ? &#x27;&lt;strong&gt;审核结果：&lt;/strong&gt;发票事实已创建，候选关联已拒绝&#x27; : &#x27;&lt;strong&gt;审核结果：&lt;/strong&gt;发票事实与关联记录已创建&#x27; : linkChoice ? &#x27;&lt;strong&gt;审核结果：&lt;/strong&gt;7 个字段通过，关联结果已选择&#x27; : &#x27;&lt;strong&gt;审核结果：&lt;/strong&gt;7 个字段通过，1 个名称差异和关联选择需要确认&#x27;;
          if (reviewStep &amp;&amp; factStep) {
            reviewStep.className = `sbm02-review-step ${state === &#x27;completed&#x27; ? &#x27;sbm02-review-step-done&#x27; : &#x27;sbm02-review-step-current&#x27;}`;
            reviewStep.querySelector(&#x27;.sbm02-review-step-index&#x27;).textContent = state === &#x27;completed&#x27; ? &#x27;✓&#x27; : &#x27;3&#x27;;
            factStep.className = `sbm02-review-step ${state === &#x27;completed&#x27; ? &#x27;sbm02-review-step-done&#x27; : &#x27;&#x27;}`;
            factStep.querySelector(&#x27;.sbm02-review-step-index&#x27;).textContent = state === &#x27;completed&#x27; ? &#x27;✓&#x27; : &#x27;4&#x27;;
          }
        }
      };

      root.querySelectorAll(&#x27;[data-scenario-page]&#x27;).forEach((button) =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; setScenario(button.dataset.scenarioPage, button.dataset.scenarioState));
      });

      const reviewWindow = root.querySelector(&#x27;[data-page-window=&quot;review&quot;]&#x27;);
      if (reviewWindow) {
        reviewWindow.querySelectorAll(&#x27;.sbm02-review-tab&#x27;).forEach((tab) =&gt; {

            reviewWindow.querySelectorAll(&#x27;.sbm02-review-tab&#x27;).forEach((button) =&gt; button.setAttribute(&#x27;aria-pressed&#x27;, String(button === tab)));
          });

        reviewWindow.querySelectorAll(&#x27;[data-review-field]&#x27;).forEach((field) =&gt; {
          field.addEventListener(&#x27;click&#x27;, () =&gt; {
            const key = field.dataset.reviewField;
            reviewWindow.querySelectorAll(&#x27;[data-review-field]&#x27;).forEach((item) =&gt; item.setAttribute(&#x27;aria-pressed&#x27;, String(item === field)));
            reviewWindow.querySelectorAll(&#x27;[data-review-evidence]&#x27;).forEach((evidence) =&gt; evidence.classList.remove(&#x27;sbm02-paper-evidence-active&#x27;));
            const evidence = reviewWindow.querySelector(`[data-review-evidence=&quot;${key}&quot;]`);
            if (evidence) evidence.classList.add(&#x27;sbm02-paper-evidence-active&#x27;);
          });
        });
        reviewWindow.querySelectorAll(&#x27;input[name=&quot;sbm02-link-choice&quot;]&#x27;).forEach((choice) =&gt; {
          choice.addEventListener(&#x27;change&#x27;, () =&gt; setScenario(&#x27;review&#x27;, reviewWindow.dataset.state));
        });
        const confirm = reviewWindow.querySelector(&#x27;[data-review-confirm]&#x27;);
        if (confirm) confirm.addEventListener(&#x27;click&#x27;, () =&gt; {
          if (reviewWindow.dataset.state === &#x27;stale&#x27;) setScenario(&#x27;review&#x27;, &#x27;default&#x27;);
          else setScenario(&#x27;review&#x27;, &#x27;completed&#x27;);
        });
      }

      const inboxWindow = root.querySelector(&#x27;[data-page-window=&quot;inbox&quot;]&#x27;);
      if (inboxWindow) {
        inboxWindow.querySelectorAll(&#x27;[data-inbox-filter]&#x27;).forEach((filter) =&gt; {
          filter.addEventListener(&#x27;click&#x27;, () =&gt; {
            const value = filter.dataset.inboxFilter;
            inboxWindow.querySelectorAll(&#x27;[data-inbox-filter]&#x27;).forEach((button) =&gt; button.setAttribute(&#x27;aria-pressed&#x27;, String(button === filter)));
            inboxWindow.querySelectorAll(&#x27;[data-inbox-row-status]&#x27;).forEach((row) =&gt; {
              row.hidden = value !== &#x27;all&#x27; &amp;&amp; row.dataset.inboxRowStatus !== value;
            });
          });
        });
        const upload = inboxWindow.querySelector(&#x27;[data-inbox-upload]&#x27;);
        if (upload) upload.addEventListener(&#x27;click&#x27;, () =&gt; setScenario(&#x27;inbox&#x27;, &#x27;processing&#x27;));
      }

      const billWindow = root.querySelector(&#x27;[data-page-window=&quot;bills&quot;]&#x27;);
      const billDetails = {
        &#x27;invoice-18&#x27;: { name: &#x27;星环云服务（测试）&#x27;, kind: &#x27;发票&#x27;, amount: &#x27;CNY 2,000.00&#x27;, date: &#x27;2026-08-18&#x27;, source: &#x27;星环云服务发票.pdf&#x27;, audit: &#x27;由 finance@qinghe.example 确认&#x27; },
        &#x27;payment-42&#x27;: { name: &#x27;星环科技（测试）&#x27;, kind: &#x27;支付&#x27;, amount: &#x27;CNY 2,000.00&#x27;, date: &#x27;2026-08-18&#x27;, source: &#x27;企业卡流水截图.png&#x27;, audit: &#x27;由 finance@qinghe.example 确认&#x27; },
        &#x27;invoice-17&#x27;: { name: &#x27;青岚出行（测试）&#x27;, kind: &#x27;发票&#x27;, amount: &#x27;CNY 486.00&#x27;, date: &#x27;2026-08-16&#x27;, source: &#x27;青岚出行电子发票.pdf&#x27;, audit: &#x27;由 owner@qinghe.example 确认&#x27; },
        &#x27;payment-41&#x27;: { name: &#x27;云栖酒店（测试）&#x27;, kind: &#x27;支付&#x27;, amount: &#x27;CNY 1,268.00&#x27;, date: &#x27;2026-08-14&#x27;, source: &#x27;企业卡流水截图.png&#x27;, audit: &#x27;由 finance@qinghe.example 确认&#x27; }
      };

      if (billWindow) {
        billWindow.querySelectorAll(&#x27;[data-bill-tab]&#x27;).forEach((tab) =&gt; {
          tab.addEventListener(&#x27;click&#x27;, () =&gt; {
            const kind = tab.dataset.billTab;

            billWindow.querySelectorAll(&#x27;[data-bill-kind]&#x27;).forEach((row) =&gt; {
              row.hidden = kind !== &#x27;all&#x27; &amp;&amp; row.dataset.billKind !== kind;
            });
          });
        });

        billWindow.querySelectorAll(&#x27;[data-select-bill]&#x27;).forEach((button) =&gt; {
          button.addEventListener(&#x27;click&#x27;, () =&gt; {
            const id = button.dataset.selectBill;
            const detail = billDetails[id];
            if (!detail) return;
            billWindow.querySelectorAll(&#x27;[data-bill-id]&#x27;).forEach((row) =&gt; row.dataset.selected = String(row.dataset.billId === id));
            Object.entries(detail).forEach(([key, value]) =&gt; {
              const target = billWindow.querySelector(`[data-bill-detail=&quot;${key}&quot;]`);
              if (target) target.textContent = value;
            });
          });
        });
      }

      const loginSubmit = root.querySelector(&#x27;[data-login-submit]&#x27;);
      if (loginSubmit) {
        loginSubmit.addEventListener(&#x27;click&#x27;, () =&gt; {
          setScenario(&#x27;login&#x27;, &#x27;loading&#x27;);
          setTimeout(() =&gt; setScenario(&#x27;login&#x27;, &#x27;error&#x27;), 650);
        });
      }
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
