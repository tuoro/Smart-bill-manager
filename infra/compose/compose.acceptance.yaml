services:
  app:
    command: [/opt/sbm/acceptance-start.sh]
    volumes:
      - ../../tools/acceptance-start.sh:/opt/sbm/acceptance-start.sh:ro
    secrets:
      - source: sbm_owner_password
        target: sbm_owner_password

  provider:
    image: node:24.19.0-alpine3.23
    pull_policy: never
    network_mode: service:app
    depends_on:
      app:
        condition: service_started
    command:
      - node
      - /opt/sbm/synthetic-provider.mjs
      - --listen
      - 127.0.0.1:19086
      - --api-key-file
      - /run/secrets/sbm_provider_key
      - --model
      - synthetic-local-release
      - --exercise-id
      - ${SBM_ACCEPTANCE_EXERCISE_ID:?set SBM_ACCEPTANCE_EXERCISE_ID to this run's UUIDv4}
    volumes:
      - ../../tools/synthetic-provider.mjs:/opt/sbm/synthetic-provider.mjs:ro
    secrets:
      - source: sbm_provider_key
        target: sbm_provider_key
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16777216
    user: node
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    cpus: 0.5
    mem_limit: 256m
    restart: "no"

networks:
  default:
    internal: true

secrets:
  sbm_owner_password:
    file: ${SBM_ACCEPTANCE_OWNER_PASSWORD_SOURCE:?set SBM_ACCEPTANCE_OWNER_PASSWORD_SOURCE to a protected synthetic password file}
  sbm_provider_key:
    file: ${SBM_ACCEPTANCE_PROVIDER_KEY_SOURCE:?set SBM_ACCEPTANCE_PROVIDER_KEY_SOURCE to a protected synthetic Provider key file}
